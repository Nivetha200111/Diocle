# Engine-only server (the site is on Vercel). Only Caddy (80/443) is reachable from outside.
# Usage: DIOCLE_API_DOMAIN=api.example.com docker compose -f docker-compose.api.yml up -d --build
#
# The api holds the secrets (model key, GitHub token) and never runs code it did not write: every verification job
# (cobc, javac and both programs) goes to the sandbox as an HTTP request carrying the files, and only the report
# comes back. The sandbox has no secrets, no internet, no shared volumes, a read-only filesystem and hard limits.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: diocle-engine
    env_file: ${DIOCLE_ENV_FILE:-./diocle.env}
    environment:
      DIOCLE_SANDBOX_URL: http://sandbox:8100
    volumes:
      - diocle-runs:/srv/diocle/runs
    networks: [default, sandbox]
    depends_on: [sandbox]
    restart: unless-stopped
    mem_limit: 1280m

  sandbox:
    image: diocle-engine
    pull_policy: never
    entrypoint: ["/srv/diocle/services/verifier/.venv/bin/python", "-m", "diocle_verifier.sandbox"]
    # root inside the container with only these capabilities: jobs run as nobody, so a program can neither
    # signal the server nor survive the cleanup after its job
    user: "0:0"
    # deliberately no env_file and no volumes: nothing secret and nothing shared exists in this container
    networks: [sandbox]  # internal only: reachable from the api, no route to the internet
    init: true  # reaps processes; the server kills every other process after each job
    read_only: true
    tmpfs: ["/tmp:size=384m,exec"]  # programs are built and run here, so exec is required (noexec is the default)
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    ulimits:
      fsize: 268435456  # bytes: no single file over 256 MB
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DIOCLE_API_DOMAIN: ${DIOCLE_API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile.api:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

networks:
  sandbox:
    internal: true

volumes:
  diocle-runs:
    name: deploy_diocle-runs
  caddy-data:
