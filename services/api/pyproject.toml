[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diocle-api"
version = "0.1.0"
description = "Diocle API: serves converter runs (agent trace, verification, usage) to the portal."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4"]

[tool.setuptools]
packages = ["diocle_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
