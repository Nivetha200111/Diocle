[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diocle-analyzer"
version = "0.1.0"
description = "Deterministic COBOL, copybook and JCL analysis for Diocle"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["diocle_analyzer"]
