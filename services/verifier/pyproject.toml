[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diocle-verifier"
version = "0.2.0"
description = "Differential testing of original COBOL (GnuCOBOL) vs converted Java."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["toolchain: needs GnuCOBOL (cobc), a JDK or the SQLite JDBC jar; deselect with -m \"not toolchain\" (scripts/test.sh --fast)"]

[tool.setuptools]
packages = ["diocle_verifier"]

[tool.setuptools.package-data]
# Non-editable installs (the delivery CI's `pip install services/verifier`) must carry the stand-in sources.
diocle_verifier = ["standins/*.cbl"]
