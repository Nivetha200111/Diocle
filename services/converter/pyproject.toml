[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diocle-converter"
version = "0.1.0"
description = "COBOL to Java conversion and a tool-using repair agent, using Meta models only."
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
verify = ["diocle-verifier"]

[tool.setuptools]
packages = ["diocle_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["toolchain: needs GnuCOBOL (cobc), a JDK or the SQLite JDBC jar; deselect with -m \"not toolchain\" (scripts/test.sh --fast)"]
